const APP_ID="family";
const APP_PW="schedule2026";
function LoginScreen({onLogin}){
  const [id,setId]=useState("");
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");
  const [showPw,setShowPw]=useState(false);
  function attempt(){
    if(id.trim().toLowerCase()===APP_ID&&pw===APP_PW){onLogin();}
    else{setErr("Incorrect ID or password. Please try again.");setPw("");}
  }
  function onKey(e){if(e.key==="Enter")attempt();}
  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{width:"100%",maxWidth:360,background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:"36px 32px",boxShadow:"0 8px 40px rgba(0,0,0,0.4)"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:36,marginBottom:12}}>🏠</div>
          <div style={{fontSize:22,fontWeight:700,color:C.text,marginBottom:6}}>Family Scheduler</div>
          <div style={{fontSize:13,color:C.text3}}>Sign in to continue</div>
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:12,color:C.text2,marginBottom:6,fontWeight:500}}>User ID</div>
          <input
            value={id} onChange={e=>{setId(e.target.value);setErr("");}} onKeyDown={onKey}
            placeholder="Enter your ID"
            style={{width:"100%",background:C.card2,border:`1px solid ${err?'#EF4444':C.border}`,borderRadius:10,padding:"10px 14px",fontSize:14,color:C.text,outline:"none",boxSizing:"border-box"}}
            autoComplete="username"
          />
        </div>
        <div style={{marginBottom:24}}>
          <div style={{fontSize:12,color:C.text2,marginBottom:6,fontWeight:500}}>Password</div>
          <div style={{position:"relative"}}>
            <input
              value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} onKeyDown={onKey}
              type={showPw?"text":"password"}
              placeholder="Enter your password"
              style={{width:"100%",background:C.card2,border:`1px solid ${err?'#EF4444':C.border}`,borderRadius:10,padding:"10px 40px 10px 14px",fontSize:14,color:C.text,outline:"none",boxSizing:"border-box"}}
              autoComplete="current-password"
            />
            <button onClick={()=>setShowPw(v=>!v)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.text3,fontSize:13,padding:0}}>{showPw?"Hide":"Show"}</button>
          </div>
        </div>
        {err&&<div style={{background:"#2D0A0A",border:"1px solid #7F1D1D",borderRadius:8,padding:"9px 13px",fontSize:12,color:"#FCA5A5",marginBottom:16}}>{err}</div>}
        <button onClick={attempt} style={{width:"100%",padding:"12px",background:C.accent,border:"none",borderRadius:10,color:"#fff",fontSize:15,fontWeight:600,cursor:"pointer"}}>Sign in</button>
      </div>
    </div>
  );
}

// ── Root App ──
function App(){
  const [authed,setAuthed]=useState(()=>sessionStorage.getItem("fs_auth")==="1");
  const [loading,setLoading]=useState(true);
  const [page,setPage]=useState("home");
  const [subPage,setSubPage]=useState(null);
  const [selectedKidKey,setSelectedKidKey]=useState(null);
  const [activitiesTab,setActivitiesTab]=useState("calendar");
  const [years,setYears]=useState([2026]);
  const [activeYear,setActiveYear]=useState(2026);
  const [yearData,setYearData]=useState({2026:{schedule:DEF_SCHED,providers:DEF_PROVIDERS,weeks:DEF_WEEKS,notes:""}});
  const [sports,setSports]=useState(DEF_SPORTS);
  const [conflicts,setConflicts]=useState([]);
  const [showSettings,setShowSettings]=useState(false);
  const [settings,setSettings]=useState({sportOptions:DEFAULT_SPORT_OPTIONS});
  const [kids,setKids]=useState(KIDS_DEF);
  const [sportNavTarget,setSportNavTarget]=useState(null);
  const [houseData,setHouseData]=useState({projects:[],contacts:[],purchases:[],receipts:[]});

  useEffect(()=>{
    async function load(){
      try{
        const yl=await store.get(SK.years);
        if(yl){setYears(yl);const data={};for(const y of yl){const r=await store.get(SK.year(y));data[y]=r||{schedule:DEF_SCHED,providers:DEF_PROVIDERS,weeks:DEF_WEEKS,notes:""};} setYearData(data);}
        const acts=await store.get(SK.activities);if(acts)setSports(acts);
        const sett=await store.get(SK.settings);if(sett)setSettings(sett);
        const kds=await store.get(SK.kids);if(kds)setKids(kds);
        const hd=await store.get(SK.house);if(hd)setHouseData(hd);
      }catch(e){console.error(e);}
      setLoading(false);
    }
    load();
  },[]);

  async function persistYear(y,data){
    const nd={...yearData,[y]:data};setYearData(nd);
    await store.set(SK.year(y),data);
    if(!years.includes(y)){const ny=[...years,y].sort((a,b)=>a-b);setYears(ny);await store.set(SK.years,ny);}
  }
  async function handleSettingsSave(newS,restoreData){
    setSettings(newS);await store.set(SK.settings,newS);
    if(restoreData){if(restoreData.sports){setSports(restoreData.sports);await store.set(SK.activities,restoreData.sports);}if(restoreData.yearData)for(const [y,d] of Object.entries(restoreData.yearData))await persistYear(Number(y),d);}
    setShowSettings(false);
  }
  async function saveKid(updatedKid){const updated=kids.map(k=>k.key===updatedKid.key?updatedKid:k);setKids(updated);await store.set(SK.kids,updated);}

  function navigate(dest,param){
    if(dest==="kids-dir"){setPage("home");setSubPage("kids-directory");setSelectedKidKey(null);}
    else if(dest==="kid-profile"){setPage("home");setSubPage("kid-profile");setSelectedKidKey(param);}
    else{setPage(dest);setSubPage(null);setSelectedKidKey(null);if(param)setActivitiesTab(param);}
  }

  const NAV=[{k:"home",label:"Home"},{k:"activities",label:"Activities"},{k:"summer",label:"Summer"},{k:"house",label:"73 Weed Hill"}];

  if(!authed)return <LoginScreen onLogin={()=>{sessionStorage.setItem("fs_auth","1");setAuthed(true);}}/>;

  if(loading)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",flexDirection:"column",gap:12,background:C.bg}}>
      <div style={{width:32,height:32,border:`3px solid ${C.border}`,borderTop:`3px solid ${C.accent}`,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <div style={{color:C.text2,fontSize:14}}>Loading…</div>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  const pageTitle={
    home:{title:"Home",sub:"Your family at a glance"},
    "kids-directory":{title:"Kids",sub:"Family profiles"},
    "kid-profile":{title:kids.find(k=>k.key===selectedKidKey)?.name||"",sub:"Individual profile"},
    activities:{title:"Activities",sub:"Extracurriculars, meets, and results"},
    summer:{title:"Summer Schedule",sub:"Camp and program schedule by year"},
    house:{title:"73 Weed Hill Ave",sub:"Home improvement tracker"},
  };
  const currentTitle=subPage?pageTitle[subPage]||(pageTitle[page]||{}):pageTitle[page]||{};

  return(
    <div style={{display:"flex",height:"100vh",overflow:"hidden",background:C.bg}}>
      {/* Sidebar */}
      <div style={{width:"clamp(160px,15vw,210px)",background:C.card,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",flexShrink:0,position:"sticky",top:0,height:"100vh",overflowY:"auto"}}>
        <div style={{padding:"20px 16px 16px",borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontSize:17,fontWeight:700,color:C.text}}>Zaphire</div>
          <div style={{fontSize:11,color:C.text3,marginTop:1}}>Family Planner</div>
        </div>
        <div style={{padding:"10px 8px",flex:1}}>
          {NAV.map(n=>(
            <button key={n.k} onClick={()=>navigate(n.k)} style={{width:"100%",textAlign:"left",padding:"10px 12px",borderRadius:8,border:"none",background:page===n.k&&!subPage?"#1E1B4B":"transparent",color:page===n.k&&!subPage?C.accent:C.text2,cursor:"pointer",fontSize:14,fontWeight:page===n.k&&!subPage?600:400,display:"flex",alignItems:"center",gap:10,marginBottom:3}}>
              {n.label}
            </button>
          ))}
        </div>
        <div style={{padding:"12px 8px 20px",borderTop:`1px solid ${C.border}`}}>
          <div style={{padding:"12px",background:C.card2,borderRadius:10,border:`1px solid ${C.border}`,marginBottom:10}}>
            <div style={{fontSize:11,color:C.text3,marginBottom:8,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.05em"}}>Family</div>
            {kids.map(k=>(
              <div key={k.key} onClick={()=>navigate("kid-profile",k.key)} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7,cursor:"pointer",borderRadius:6,padding:"3px 4px"}} onMouseEnter={e=>e.currentTarget.style.background=C.card} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <KidAvatar kid={k} size={26}/>
                <div><div style={{fontSize:12,fontWeight:600,color:C.text,lineHeight:1.2}}>{k.name}</div><div style={{fontSize:10,color:C.text3}}>Age {ageAsOf(k.dob,"2026-06-22")}</div></div>
              </div>
            ))}
          </div>
          <button onClick={()=>window.location.reload()} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1px solid #1E40AF`,background:"transparent",color:"#60A5FA",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:8,marginBottom:6}}>↺ Refresh app</button>
          <button onClick={()=>setShowSettings(true)} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.card2,color:C.text2,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:8,marginBottom:6}}>⚙ Settings</button>
          <button onClick={()=>{sessionStorage.removeItem("fs_auth");setAuthed(false);}} style={{width:"100%",padding:"9px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.text3,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:8}}>← Sign out</button>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,overflowY:"auto",height:"100vh",display:"flex",flexDirection:"column"}}>
        <div style={{maxWidth:"100%",width:"100%",padding:"22px 24px 40px",boxSizing:"border-box",flex:1}}>
          {/* Breadcrumb */}
          {(page!=="home"||subPage)&&(
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:16,fontSize:13,color:C.text3}}>
              <button onClick={()=>navigate("home")} style={{background:"none",border:"none",cursor:"pointer",color:C.accent,fontSize:13,padding:0}}>Home</button>
              {subPage==="kid-profile"&&<><span>›</span><button onClick={()=>navigate("kids-dir")} style={{background:"none",border:"none",cursor:"pointer",color:C.accent,fontSize:13,padding:0}}>Kids</button></>}
              {(subPage||page!=="home")&&<><span>›</span><span style={{color:C.text2}}>{currentTitle.title}</span></>}
            </div>
          )}
          <div style={{marginBottom:20}}>
            <h1 style={{fontSize:22,fontWeight:700,color:C.text,marginBottom:2}}>{currentTitle.title}</h1>
            <div style={{fontSize:13,color:C.text2}}>{currentTitle.sub}</div>
          </div>

          {page==="home"&&!subPage&&<Dashboard sports={sports} summerData={yearData[activeYear]} conflicts={conflicts} kids={kids} onNavigate={navigate}/>}
          {page==="home"&&subPage==="kids-directory"&&<KidsDirectoryPage kids={kids} sports={sports} onSelectKid={k=>navigate("kid-profile",k)} onBack={()=>navigate("home")}/>}
          {page==="home"&&subPage==="kid-profile"&&<KidProfilePage kidKey={selectedKidKey} kids={kids} sports={sports} yearData={yearData} years={years} onBack={()=>navigate("kids-dir")} onNavigateToSport={(sportId,sessId)=>{setPage("activities");setSubPage(null);setActivitiesTab("activities");setSportNavTarget({sportId,sessId});}}/>}
          {page==="activities"&&<ActivitiesPage sports={sports} setSports={setSports} conflicts={conflicts} setConflicts={setConflicts} summerData={yearData[activeYear]} settings={settings} initialTab={activitiesTab} kids={kids} onKidClick={k=>navigate("kid-profile",k)} sportNavTarget={sportNavTarget} onSportNavConsumed={()=>setSportNavTarget(null)}/>}
          {page==="summer"&&<SummerSection yearData={yearData} years={years} activeYear={activeYear} setActiveYear={setActiveYear} onYearDataChange={persistYear} kids={kids}/>}
          {page==="house"&&<HousePage data={houseData} onChange={async d=>{setHouseData(d);await store.set(SK.house,d);}}/>}
        </div>
      </div>

      {showSettings&&<SettingsModal settings={settings} onSave={handleSettingsSave} allData={{sports,yearData,settings,years,kids}} onClose={()=>setShowSettings(false)} kids={kids} onSaveKid={saveKid}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
