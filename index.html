function AddrInp({value,onChange,placeholder}){
  const [query,setQuery]=useState(value||"");
  const [suggestions,setSuggestions]=useState([]);
  const [open,setOpen]=useState(false);
  const debounceRef=useRef(null);
  const wrapRef=useRef(null);

  useEffect(()=>{setQuery(value||"");},[value]);

  useEffect(()=>{
    function handleClick(e){if(wrapRef.current&&!wrapRef.current.contains(e.target)){setOpen(false);setSuggestions([]);}}
    document.addEventListener("mousedown",handleClick);
    return()=>document.removeEventListener("mousedown",handleClick);
  },[]);

  function handleChange(e){
    const v=e.target.value;
    setQuery(v);
    onChange(v);
    clearTimeout(debounceRef.current);
    if(v.length<3){setSuggestions([]);setOpen(false);return;}
    debounceRef.current=setTimeout(async()=>{
      try{
        const url=`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(v)}.json?access_token=${MAPBOX_TOKEN}&autocomplete=true&country=US&types=address,poi,place&limit=5`;
        const res=await fetch(url);
        const data=await res.json();
        setSuggestions(data.features||[]);
        setOpen(true);
      }catch{setSuggestions([]);setOpen(false);}
    },300);
  }

  function handleSelect(feat){
    const full=feat.place_name||feat.text||"";
    setQuery(full);
    onChange(full);
    setSuggestions([]);
    setOpen(false);
  }

  function getSubtitle(feat){
    const parts=feat.place_name?.split(", ")||[];
    return parts.slice(1).join(", ");
  }

  return(
    <div className="ac-wrap" ref={wrapRef}>
      <input
        type="text"
        value={query}
        onChange={handleChange}
        onFocus={()=>{if(suggestions.length>0)setOpen(true);}}
        placeholder={placeholder||"Start typing an address…"}
        style={{width:"100%",padding:"8px 12px",borderRadius:open&&suggestions.length?`8px 8px 0 0`:"8px",border:`1px solid ${open&&suggestions.length?"#6366F1":"#2D3748"}`,fontSize:13,background:"#222536",color:"#E2E8F0"}}
      />
      {open&&suggestions.length>0&&(
        <div className="ac-dropdown">
          {suggestions.map((feat,i)=>(
            <div key={i} className="ac-item" onMouseDown={()=>handleSelect(feat)}>
              <div className="ac-item-main">{feat.text||feat.place_name?.split(",")[0]}</div>
              <div className="ac-item-sub">{getSubtitle(feat)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Inp({value,onChange,placeholder,type="text"}){return <input type={type} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder||""} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,fontSize:13,background:C.card2,color:C.text}}/>;}
function Sel({value,onChange,options}){return <select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,fontSize:13,background:C.card2,color:C.text}}>{options.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}</select>;}
function Btn({onClick,children,variant="primary",small}){

}

function SessionModal({session,onSave,onClose}){
  const blank={id:Date.now()+"",name:"",start:"",end:"",cost:"",practiceDays:[],practiceTime:"",practiceLocation:"",practiceDayDetails:[],practiceNotes:"",enrolled:true,meets:[]};
  // migrate old sessions that only have practiceTime/practiceLocation
  function migrate(s){
    if(!s)return blank;
    if(!s.practiceNotes)s={...s,practiceNotes:""};
    // build practiceDayDetails from existing days if missing or incomplete
    const existingDetails=s.practiceDayDetails||[];
    const mergedDetails=(s.practiceDays||[]).map(day=>{
      const existing=existingDetails.find(x=>x.day===day);
      return existing||{day,time:s.practiceTime||"",timeEnd:"",location:s.practiceLocation||""};
    });
    s={...s,practiceDayDetails:mergedDetails};
    return s;
  }
  const [s,setS]=useState(migrate(session||blank));

  const tog=d=>{
    const hasDays=s.practiceDays.includes(d);
    const newDays=hasDays?s.practiceDays.filter(x=>x!==d):[...s.practiceDays,d];
    const newDetails=hasDays?s.practiceDayDetails.filter(x=>x.day!==d):[...s.practiceDayDetails,{day:d,time:s.practiceTime||"",timeEnd:"",location:s.practiceLocation||""}];
    setS({...s,practiceDays:newDays,practiceDayDetails:newDetails});
  };
  function updDetail(day,field,val){
    setS({...s,practiceDayDetails:s.practiceDayDetails.map(d=>d.day===day?{...d,[field]:val}:d)});
  }
  // keep legacy practiceTime in sync with first day for backwards compat
  function save(){
    const first=s.practiceDayDetails[0];
    onSave({...s,practiceTime:first?first.time:s.practiceTime,practiceLocation:first?first.location:s.practiceLocation});
  }

  return(
    <Modal title={session?"Edit session":"Add session"} onClose={onClose} wide>
      <F label="Session name"><Inp value={s.name} onChange={v=>setS({...s,name:v})} placeholder="e.g. Spring 2026"/></F>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <F label="Start date"><Inp type="date" value={s.start} onChange={v=>setS({...s,start:v})}/></F>
        <F label="End date"><Inp type="date" value={s.end} onChange={v=>setS({...s,end:v})}/></F>
      </div>
      <F label="Cost ($)"><Inp type="number" value={s.cost} onChange={v=>setS({...s,cost:v})}/></F>
      <F label="Practice days — click to toggle, then set time per day">
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:s.practiceDays.length?10:0}}>
          {DAYS.map(d=><button key={d} onClick={()=>tog(d)} style={{padding:"4px 10px",borderRadius:6,border:`1px solid ${s.practiceDays.includes(d)?C.accent:C.border}`,background:s.practiceDays.includes(d)?C.accent:C.card2,color:s.practiceDays.includes(d)?"#fff":C.text2,cursor:"pointer",fontSize:12}}>{d}</button>)}
        </div>
        {DAYS.filter(d=>s.practiceDays.includes(d)).map(d=>{
          const det=s.practiceDayDetails.find(x=>x.day===d)||{time:"",timeEnd:"",location:""};
          return(
            <div key={d} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",marginBottom:6}}>
              <div style={{fontSize:12,fontWeight:600,color:C.accent,marginBottom:6}}>{d}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr",gap:8}}>
                <F label="Start time"><Inp value={det.time} onChange={v=>updDetail(d,"time",v)} placeholder="4:00 PM"/></F>
                <F label="End time"><Inp value={det.timeEnd} onChange={v=>updDetail(d,"timeEnd",v)} placeholder="6:00 PM"/></F>
                <F label="Location"><AddrInp value={det.location} onChange={v=>updDetail(d,"location",v)} placeholder="Practice location"/></F>
              </div>
            </div>
          );
        })}
      </F>
      <F label="Practice notes (optional)">
        <textarea value={s.practiceNotes} onChange={e=>setS({...s,practiceNotes:e.target.value})} placeholder="e.g. Bring cleats on Fridays, meet at back entrance on Thursdays..." rows={3} style={{width:"100%",background:C.card2,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:13,color:C.text,resize:"vertical",boxSizing:"border-box",fontFamily:"inherit"}}/>
      </F>
      <F label="Enrollment">
        <div style={{display:"flex",gap:8}}>
          {[true,false].map(b=><button key={String(b)} onClick={()=>setS({...s,enrolled:b})} style={{padding:"6px 16px",borderRadius:7,border:`1px solid ${s.enrolled===b?C.accent:C.border}`,background:s.enrolled===b?C.accent:C.card2,color:s.enrolled===b?"#fff":C.text2,cursor:"pointer",fontSize:13}}>{b?"Enrolled":"Reference only"}</button>)}
        </div>
      </F>
      <div style={{display:"flex",gap:10,marginTop:10}}><Btn onClick={onClose} variant="secondary">Cancel</Btn><Btn onClick={save}>Save session</Btn></div>
    </Modal>
  );
}

// ── Calendar ──
function CalendarView({sports,summerData,showSummer,showEC,conflicts,onEventClick,kids}){
  const today=new Date();
  const [viewMode,setViewMode]=useState("month");
  const [curDate,setCurDate]=useState(new Date(2026,5,1));

  const events=[];
  if(showEC){
    sports.forEach(sp=>{
      const sc=getSC(sp.name);
      sp.sessions.forEach(sess=>{
        if(!sess.enrolled)return;
        const start=new Date(sess.start+"T12:00:00"),end=new Date(sess.end+"T12:00:00");
        const cur=new Date(start);
        while(cur<=end){
          const dayName=DAYS[cur.getDay()];
          if(dayName&&sess.practiceDays.includes(dayName)){
            const det=(sess.practiceDayDetails||[]).find(x=>x.day===dayName);
            const timeLabel=det?det.time:sess.practiceTime;
            const subLabel=det?(det.time+(det.timeEnd?` – ${det.timeEnd}`:"")+( det.location?` · ${det.location}`:"")):sess.practiceTime;
            const yy=cur.getFullYear(),mm=String(cur.getMonth()+1).padStart(2,"0"),dd=String(cur.getDate()).padStart(2,"0");
            events.push({date:`${yy}-${mm}-${dd}`,type:"practice",label:sp.name,sub:subLabel||timeLabel,kidKey:sp.kidKey,color:sc.txt,bg:sc.bg,border:sc.border,sportId:sp.id,sessionId:sess.id,meetId:null});
          }
          cur.setDate(cur.getDate()+1);
        }
        sess.meets.forEach(m=>{
          const conf=conflicts.find(c=>c.kidKey===sp.kidKey&&c.date===(m.dateStart||m.date));
          const notAtt=conf&&conf.chosen&&conf.chosen!==m.id;
          events.push({date:m.dateStart||m.date||"",type:"meet",label:m.name,sub:`${m.time} · ${m.location}`,kidKey:sp.kidKey,color:notAtt?C.text3:sc.txt,bg:notAtt?C.card2:sc.bg,border:notAtt?C.border:sc.border,notAttending:notAtt,sportId:sp.id,sessionId:sess.id,meetId:m.id,isMultiDay:m.dateEnd&&m.dateEnd!==m.dateStart});
        });
      });
    });
  }
  if(showSummer&&summerData){
    summerData.weeks.forEach((wk,wi)=>{
      kids.forEach(k=>{
        const s=summerData.schedule[k.key]?.[wi];
        if(!s||s.a==="Unscheduled")return;
        const c=getTC(s.a);
        const _sd=new Date(2026,5,22+wi*7);const _sds=`${_sd.getFullYear()}-${String(_sd.getMonth()+1).padStart(2,"0")}-${String(_sd.getDate()).padStart(2,"0")}`;
        events.push({date:_sds,type:"summer",label:s.a,sub:wk.dates,kidKey:k.key,color:c.txt,bg:c.bg,border:c.border,sportId:null});
      });
    });
  }

  const evOn=d=>events.filter(e=>e.date===d);
  const icon=t=>t==="meet"?"★":t==="practice"?"▸":"☀";

  function VToggle(){return <div style={{display:"flex",gap:4}}>{["day","week","month"].map(v=><button key={v} onClick={()=>setViewMode(v)} style={{padding:"5px 12px",borderRadius:7,border:`1px solid ${viewMode===v?C.accent:C.border}`,background:viewMode===v?C.accent:C.card2,color:viewMode===v?"#fff":C.text2,cursor:"pointer",fontSize:12,textTransform:"capitalize"}}>{v}</button>)}</div>;}

  if(viewMode==="month"){
    const yr=curDate.getFullYear(),mo=curDate.getMonth();
    const first=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate();
    const cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);
    return(
      <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)",minHeight:500}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexShrink:0}}>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button onClick={()=>setCurDate(new Date(yr,mo-1,1))} style={{padding:"5px 11px",borderRadius:7,border:`1px solid ${C.border}`,background:C.card2,cursor:"pointer",fontSize:14,color:C.text}}>‹</button>
            <span style={{fontWeight:600,fontSize:15,color:C.text}}>{MONTHS[mo]} {yr}</span>
            <button onClick={()=>setCurDate(new Date(yr,mo+1,1))} style={{padding:"5px 11px",borderRadius:7,border:`1px solid ${C.border}`,background:C.card2,cursor:"pointer",fontSize:14,color:C.text}}>›</button>
          </div>
          <VToggle/>
        </div>
        <div style={{border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",flex:1,display:"flex",flexDirection:"column"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",flexShrink:0}}>
            {DAYS.map((d,i)=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:600,color:C.text2,padding:"8px 0",background:C.card3,borderRight:i<6?`1px solid ${C.border}`:"none"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gridAutoRows:"1fr",flex:1}}>
            {cells.map((d,i)=>{
              const col=i%7;
              const borderR=col<6?`1px solid ${C.border}`:"none";
              if(!d)return <div key={i} style={{background:"#13151F",borderRight:borderR,borderTop:`1px solid ${C.border}`,height:"100%"}}/>;
              const ds=`${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
              const evs=evOn(ds);
              const isToday=today.getDate()===d&&today.getMonth()===mo&&today.getFullYear()===yr;
              return(
                <div key={i} style={{background:isToday?"#0F1D35":C.card,borderRight:borderR,borderTop:`1px solid ${C.border}`,padding:"4px",overflow:"hidden"}}>
                  <div onClick={()=>{setCurDate(new Date(yr,mo,d));setViewMode("day");}} style={{fontSize:12,fontWeight:isToday?700:400,display:"inline-flex",alignItems:"center",justifyContent:"center",width:22,height:22,borderRadius:"50%",background:isToday?C.accent:"transparent",color:isToday?"#fff":C.text3,marginBottom:2,cursor:"pointer"}}>{d}</div>
                  {evs.slice(0,3).map((e,ei)=><div key={ei} onClick={()=>onEventClick(e)} title={e.label} style={{background:e.bg,color:e.color,border:`1px solid ${e.border}`,borderRadius:4,padding:"1px 4px",fontSize:10,fontWeight:500,marginBottom:2,cursor:"pointer",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",opacity:e.notAttending?0.4:1}}>{icon(e.type)} {e.label}</div>)}
                  {evs.length>3&&<div style={{fontSize:9,color:C.text3,cursor:"pointer"}} onClick={()=>{setCurDate(new Date(yr,mo,d));setViewMode("day");}}>+{evs.length-3} more</div>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }
  if(viewMode==="week"){
    const ws=new Date(curDate);ws.setDate(ws.getDate()-ws.getDay());
    const wds=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d;});
    return(
      <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)",minHeight:500}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexShrink:0}}>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button onClick={()=>{const d=new Date(curDate);d.setDate(d.getDate()-7);setCurDate(d);}} style={{padding:"5px 11px",borderRadius:7,border:`1px solid ${C.border}`,background:C.card2,cursor:"pointer",fontSize:14,color:C.text}}>‹</button>
            <span style={{fontWeight:600,fontSize:14,color:C.text}}>{wds[0].toLocaleDateString("en-US",{month:"short",day:"numeric"})} – {wds[6].toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</span>
            <button onClick={()=>{const d=new Date(curDate);d.setDate(d.getDate()+7);setCurDate(d);}} style={{padding:"5px 11px",borderRadius:7,border:`1px solid ${C.border}`,background:C.card2,cursor:"pointer",fontSize:14,color:C.text}}>›</button>
          </div>
          <VToggle/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gridAutoRows:"1fr",border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",flex:1}}>
          {wds.map((wd,i)=>{
            const ds=`${wd.getFullYear()}-${String(wd.getMonth()+1).padStart(2,"0")}-${String(wd.getDate()).padStart(2,"0")}`,evs=evOn(ds),isToday=wd.toDateString()===today.toDateString();
            return(
              <div key={i} style={{background:isToday?"#0F1D35":C.card,borderRight:i<6?`1px solid ${C.border}`:"none",padding:"6px 5px",minHeight:120}}>
                <div onClick={()=>{setCurDate(wd);setViewMode("day");}} style={{fontSize:11,fontWeight:600,color:isToday?"#fff":C.text2,marginBottom:4,cursor:"pointer",display:"inline-flex",flexDirection:"column",alignItems:"center",background:isToday?C.accent:"transparent",borderRadius:6,padding:isToday?"2px 6px":"0"}}>
                  <span style={{fontSize:10}}>{DAYS[i]}</span><span style={{fontSize:14}}>{wd.getDate()}</span>
                </div>
                {evs.map((e,ei)=><div key={ei} onClick={()=>onEventClick(e)} style={{background:e.bg,color:e.color,border:`1px solid ${e.border}`,borderRadius:4,padding:"3px 5px",fontSize:10,fontWeight:500,marginBottom:2,cursor:"pointer",lineHeight:1.3}}>{icon(e.type)} {e.label}</div>)}
              </div>
            );
          })}
        </div>
      </div>
    );
  }
  const ds=`${curDate.getFullYear()}-${String(curDate.getMonth()+1).padStart(2,"0")}-${String(curDate.getDate()).padStart(2,"0")}`,evs=evOn(ds),isToday=curDate.toDateString()===today.toDateString();
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <button onClick={()=>{const d=new Date(curDate);d.setDate(d.getDate()-1);setCurDate(d);}} style={{padding:"5px 11px",borderRadius:7,border:`1px solid ${C.border}`,background:C.card2,cursor:"pointer",fontSize:14,color:C.text}}>‹</button>
          <span style={{fontWeight:600,fontSize:15,color:isToday?C.accent:C.text}}>{curDate.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}{isToday?" — Today":""}</span>
          <button onClick={()=>{const d=new Date(curDate);d.setDate(d.getDate()+1);setCurDate(d);}} style={{padding:"5px 11px",borderRadius:7,border:`1px solid ${C.border}`,background:C.card2,cursor:"pointer",fontSize:14,color:C.text}}>›</button>
        </div>
        <VToggle/>
      </div>
      {evs.length===0&&<div style={{textAlign:"center",padding:"40px 20px",color:C.text3,fontSize:13}}>Nothing scheduled this day.</div>}
      {evs.map((e,i)=>{
        const kid=kids.find(k=>k.key===e.kidKey);
        return(
          <div key={i} onClick={()=>onEventClick(e)} style={{background:e.bg,border:`1px solid ${e.border}`,borderLeft:`4px solid ${e.color}`,borderRadius:10,padding:"14px 16px",marginBottom:10,cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div><div style={{fontWeight:600,fontSize:14,color:e.color,marginBottom:3}}>{icon(e.type)} {e.label}</div>{e.sub&&<div style={{fontSize:12,color:C.text2}}>{e.sub}</div>}</div>
              {kid&&<KidPill kid={kid}/>}
            </div>
            <div style={{fontSize:11,color:C.text3,marginTop:8}}>Tap to edit →</div>
          </div>
        );
      })}
    </div>
  );
}

          <Btn onClick={()=>{if(!journalEntry.trim())return;setSavedNotes([{date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),text:journalEntry.trim()},...savedNotes]);setJournalEntry("");}} small>Save entry</Btn>
          {savedNotes.map((n,i)=><div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",marginBottom:8,marginTop:i===0?14:0}}><div style={{fontSize:11,color:C.text3,marginBottom:4}}>{n.date}</div><div style={{fontSize:13,color:C.text,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{n.text}</div></div>)}

      )}
      {(kid.emergencyName||kid.doctor||kid.insurance)&&(
        <div style={{marginTop:24,background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"16px 18px"}}>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12}}>

// ── Dashboard ──
function Dashboard({sports,summerData,conflicts,kids,onNavigate}){
  const today=new Date();
  const upcoming=[];
  sports.forEach(sp=>{
    sp.sessions.forEach(sess=>{
      if(!sess.enrolled)return;
      sess.meets.forEach(m=>{
        const d=new Date((m.dateStart||m.date)+"T12:00:00");
        const diff=Math.floor((d-today)/(1000*60*60*24));
        if(diff>=0&&diff<=60){
          const conf=conflicts.find(c=>c.kidKey===sp.kidKey&&c.date===(m.dateStart||m.date));
          upcoming.push({...m,kidKey:sp.kidKey,sportName:sp.name,diff,hasConflict:!!conf&&conf.events?.length>1});
        }
      });
    });
  });
  upcoming.sort((a,b)=>a.diff-b.diff);
  const allSess=sports.flatMap(sp=>sp.sessions.map(s=>({...s,kidKey:sp.kidKey})));
  const grandTotal=allSess.filter(s=>s.enrolled).reduce((sum,s)=>sum+Number(s.cost||0),0);
  const yr=today.getFullYear(),mo=today.getMonth();
  const first=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate();
  const calCells=[];for(let i=0;i<first;i++)calCells.push(null);for(let d=1;d<=dim;d++)calCells.push(d);
  const meetDates=new Set(sports.flatMap(sp=>sp.sessions.flatMap(sess=>sess.meets.map(m=>Number((m.dateStart||m.date||"").split("-")[2])))));
  const tileStyle={background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"18px 20px",cursor:"pointer",transition:"border-color 0.15s"};
  return(
    <div>
      <div style={{marginBottom:22}}>
        <div style={{fontSize:13,color:C.text2,marginBottom:4}}>{today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
        <div style={{fontSize:24,fontWeight:700,color:C.text}}>Good {today.getHours()<12?"morning":today.getHours()<17?"afternoon":"evening"} 👋</div>
      </div>
      {/* Upcoming */}
      <div style={{...tileStyle,marginBottom:14}} onClick={()=>onNavigate("activities","calendar")} onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div style={{fontWeight:600,fontSize:15,color:C.text}}>📅 Upcoming meets</div>
          <span style={{fontSize:12,color:C.accent}}>View calendar →</span>
        </div>
        {upcoming.length===0&&<div style={{fontSize:13,color:C.text3}}>No meets in the next 60 days.</div>}
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          {upcoming.slice(0,4).map((m,i)=>{
            const sc=getSC(m.sportName);const kid=kids.find(k=>k.key===m.kidKey);
            const dLabel=m.diff===0?"Today":m.diff===1?"Tomorrow":`In ${m.diff} days`;
            const isMulti=m.dateEnd&&m.dateEnd!==m.dateStart;
            return(
              <div key={i} style={{background:sc.bg,border:`1px solid ${m.hasConflict?"#F59E0B":sc.border}`,borderRadius:10,padding:"10px 14px",flex:"1 1 180px",minWidth:160}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                  <span style={{fontSize:10,fontWeight:600,color:sc.txt,background:"rgba(0,0,0,0.2)",padding:"1px 7px",borderRadius:4}}>{dLabel}</span>
                  {kid&&<KidPill kid={kid} small/>}
                </div>
                <div style={{fontWeight:600,fontSize:13,color:"#E2E8F0",marginBottom:2}}>{m.name}</div>
                <div style={{fontSize:11,color:"#64748B"}}>{isMulti?`${fmtDate(m.dateStart)} – ${fmtDate(m.dateEnd)}`:fmtDate(m.dateStart)}{m.time?` · ${m.time}`:""}</div>
              </div>
            );
          })}
        </div>
      </div>
      {/* Kids + Finances */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
        <div style={tileStyle} onClick={()=>onNavigate("kids-dir")} onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{fontWeight:600,fontSize:15,color:C.text}}>👨‍👩‍👧‍👦 Kids</div>
            <span style={{fontSize:12,color:C.accent}}>View all →</span>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {kids.filter(k=>k.key!=="sadie").map(k=>{
              const ks=sports.filter(s=>s.kidKey===k.key);
              const sn=[...new Set(ks.map(s=>s.name))];
              return(
                <div key={k.key} onClick={e=>{e.stopPropagation();onNavigate("kid-profile",k.key);}} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:C.card2,borderRadius:8,border:`1px solid ${C.border}`,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.borderColor=k.color} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <KidAvatar kid={k} size={32}/>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:k.color}}>{k.name}</div><div style={{fontSize:11,color:C.text3}}>{sn.length?sn.join(" · "):"No activities"}</div></div>
                  <div style={{fontSize:11,color:C.text3}}>Age {ageAsOf(k.dob,"2026-06-22")}</div>
                </div>
              );
            })}
          </div>
        </div>
        <div style={tileStyle} onClick={()=>onNavigate("activities","finances")} onMouseEnter={e=>e.currentTarget.style.borderColor=C.success} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div style={{fontWeight:600,fontSize:15,color:C.text}}>💰 Finances</div>
            <span style={{fontSize:12,color:"#10B981"}}>View detail →</span>
          </div>
          <div style={{fontSize:28,fontWeight:700,color:C.text,marginBottom:14}}>{fmtMoney(grandTotal)}</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>

}

// ── Activities Page ──
function ActivitiesPage({sports,setSports,conflicts,setConflicts,summerData,settings,initialTab,kids,onKidClick,sportNavTarget,onSportNavConsumed}){

  const [addSession,setAddSession]=useState(null);
  const [editSession,setEditSession]=useState(null);

  const [editMeet,setEditMeet]=useState(null);
  const sportOptions=settings.sportOptions||DEFAULT_SPORT_OPTIONS;
  const uniqueSports=[...new Set(sports.map(s=>s.name))].sort();

  function persist(u){setSports(u);store.set(SK.activities,u);}
  function saveSport(sp){const u=editSport?sports.map(s=>s.id===sp.id?sp:s):[...sports,sp];persist(u);setAddSport(false);setEditSport(null);}
  function saveSession(sid,sess){const u=sports.map(s=>s.id===sid?{...s,sessions:editSession?s.sessions.map(x=>x.id===sess.id?sess:x):[...s.sessions,sess]}:s);persist(u);setAddSession(null);setEditSession(null);}
  function saveMeet(sid,sessId,meet){const u=sports.map(s=>s.id===sid?{...s,sessions:s.sessions.map(sess=>sess.id===sessId?{...sess,meets:editMeet?sess.meets.map(m=>m.id===meet.id?meet:m):[...sess.meets,meet]}:sess)}:s);persist(u);setAddMeet(null);setEditMeet(null);}
  function deleteSport(id){if(!window.confirm("Remove?"))return;persist(sports.filter(s=>s.id!==id));}
  function deleteSession(sid,sessId){persist(sports.map(s=>s.id===sid?{...s,sessions:s.sessions.filter(x=>x.id!==sessId)}:s));}
  function deleteMeet(sid,sessId,mid){persist(sports.map(s=>s.id===sid?{...s,sessions:s.sessions.map(sess=>sess.id===sessId?{...sess,meets:sess.meets.filter(m=>m.id!==mid)}:sess)}:s));}

  useEffect(()=>{
    const map={};
    sports.forEach(sp=>sp.sessions.forEach(sess=>{if(!sess.enrolled)return;sess.meets.forEach(m=>{if(!m.attending)return;const d=m.dateStart||m.date||"";const k=`${sp.kidKey}__${d}`;if(!map[k])map[k]={kidKey:sp.kidKey,date:d,events:[]};map[k].events.push({name:m.name,meetId:m.id,sportId:sp.id,sessionId:sess.id});});}));
    setConflicts(Object.values(map).filter(x=>x.events.length>1).map(c=>{const ex=conflicts.find(x=>x.kidKey===c.kidKey&&x.date===c.date);return{...c,chosen:ex?.chosen||null};}));
  },[sports]);

  function handleCalClick(ev){
    if(ev.type==="summer")return;
    if(ev.type==="meet"&&ev.meetId){const sp=sports.find(s=>s.id===ev.sportId);if(!sp)return;const sess=sp.sessions.find(s=>s.id===ev.sessionId);if(!sess)return;const meet=sess.meets.find(m=>m.id===ev.meetId);if(meet)setEditMeet({sportId:ev.sportId,sessionId:ev.sessionId,meet});}
    else if(ev.type==="practice"&&ev.sportId){const sp=sports.find(s=>s.id===ev.sportId);if(sp)setEditSport(sp);}
  }
  function resolveConflict(c,meetId){setConflicts(conflicts.map(x=>x.kidKey===c.kidKey&&x.date===c.date?{...x,chosen:meetId}:x));}

  const filtered=sports.filter(s=>(filterKid==="all"||s.kidKey===filterKid)&&(filterSport==="all"||s.name===filterSport));
  const SUBTABS=[{k:"calendar",l:"📅 Calendar"},{k:"activities",l:"🎯 Activities"},{k:"results",l:"🏆 Results"},{k:"finances",l:"💰 Finances"}];
  const today=new Date();

  // ── Finances sub-component ──
  function FinancesView(){
    const [view,setView]=useState("child");
    const allS=sports.flatMap(sp=>sp.sessions.map(s=>({...s,sportName:sp.name,kidKey:sp.kidKey,teamName:sp.teamName})));
    const grandTotal=allS.filter(s=>s.enrolled).reduce((sum,s)=>sum+Number(s.cost||0),0);
    const byChild=kids.map(k=>{const sessions=allS.filter(s=>s.kidKey===k.key&&s.enrolled);return{...k,sessions,total:sessions.reduce((sum,s)=>sum+Number(s.cost||0),0)};}).filter(k=>k.sessions.length>0);
    const bySport=[...new Set(sports.map(s=>s.name))].map(sport=>{const ss=allS.filter(s=>s.sportName===sport&&s.enrolled);return{sport,total:ss.reduce((sum,s)=>sum+Number(s.cost||0),0),sessions:ss,kids2:[...new Set(ss.map(s=>s.kidKey))]};}).filter(s=>s.sessions.length>0).sort((a,b)=>b.total-a.total);
    const byMonth=()=>{const map={};allS.filter(s=>s.enrolled&&s.start).forEach(sess=>{const start=new Date(sess.start),end=new Date(sess.end||sess.start);const cost=Number(sess.cost||0);const months=Math.max(1,Math.round((end-start)/(1000*60*60*24*30)));const monthly=cost/months;let cur=new Date(start);while(cur<=end){const key=`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}`;if(!map[key])map[key]={label:`${MONTHS[cur.getMonth()].slice(0,3)} ${cur.getFullYear()}`,total:0};map[key].total+=monthly;cur.setMonth(cur.getMonth()+1);}});return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>({key:k,...v}));};
    const VIEWS=[{k:"child",l:"By Child"},{k:"sport",l:"By Sport"},{k:"month",l:"By Month"},{k:"session",l:"By Session"}];
    return(
      <div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
          <div style={{background:"#1E1B4B",borderRadius:12,padding:"16px 18px",border:"1px solid #4338CA"}}><div style={{fontSize:12,color:"#A5B4FC",marginBottom:4}}>Total</div><div style={{fontSize:24,fontWeight:700,color:"#fff"}}>{fmtMoney(grandTotal)}</div></div>
          {kids.map(k=>{const t=allS.filter(s=>s.kidKey===k.key&&s.enrolled).reduce((sum,s)=>sum+Number(s.cost||0),0);if(!t)return null;return(<div key={k.key} onClick={()=>onKidClick&&onKidClick(k.key)} style={{background:k.bg,borderRadius:12,padding:"16px 18px",border:`1px solid ${k.color}44`,cursor:"pointer"}}><div style={{fontSize:12,color:k.color,marginBottom:4}}>{k.name}</div><div style={{fontSize:20,fontWeight:700,color:C.text}}>{fmtMoney(t)}</div></div>);})}
        </div>
        <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>{VIEWS.map(v=><button key={v.k} onClick={()=>setView(v.k)} style={{padding:"6px 16px",borderRadius:8,border:`1px solid ${view===v.k?C.accent:C.border}`,background:view===v.k?C.accent:C.card2,color:view===v.k?"#fff":C.text2,cursor:"pointer",fontSize:13}}>{v.l}</button>)}</div>
        {view==="child"&&byChild.map(k=>(
          <div key={k.key} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",marginBottom:12}}>
            <div style={{background:k.bg,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>onKidClick&&onKidClick(k.key)}>
              <div style={{display:"flex",alignItems:"center",gap:10}}><KidAvatar kid={k} size={32}/><span style={{fontWeight:600,fontSize:15,color:k.color}}>{k.name}</span></div>
              <span style={{fontWeight:700,fontSize:18,color:"#E2E8F0"}}>{fmtMoney(k.total)}</span>
            </div>
            {k.sessions.map((s,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",borderBottom:i<k.sessions.length-1?`1px solid ${C.border}`:"none"}}><div><div style={{fontSize:13,color:C.text,fontWeight:500}}>{s.sportName} — {s.name}</div><div style={{fontSize:11,color:C.text3}}>{s.teamName}</div></div><span style={{fontWeight:600,color:C.text,fontSize:13}}>{fmtMoney(s.cost)}</span></div>)}
          </div>
        ))}
        {view==="sport"&&bySport.map((s,i)=>{const sc=getSC(s.sport);return(<div key={i} style={{background:C.card,border:`1px solid ${sc.border}`,borderLeft:`4px solid ${sc.txt}`,borderRadius:12,padding:"12px 16px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><SportPill name={s.sport}/>{s.kids2.map(kk=>{const kid=kids.find(k=>k.key===kk);return kid?<KidPill key={kk} kid={kid} small/>:null;})}</div><div style={{fontSize:12,color:C.text3}}>{s.sessions.length} session{s.sessions.length>1?"s":""}</div></div><span style={{fontWeight:700,fontSize:18,color:sc.txt}}>{fmtMoney(s.total)}</span></div>);})}
        {view==="month"&&byMonth().map((m,i)=>{const pct=grandTotal?Math.round((m.total/grandTotal)*100):0;return(<div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 16px",marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontWeight:500,fontSize:14,color:C.text}}>{m.label}</span><span style={{fontWeight:700,fontSize:15,color:C.accent}}>{fmtMoney(m.total)}</span></div><div style={{background:C.card2,borderRadius:4,height:6,overflow:"hidden"}}><div style={{background:C.accent,height:"100%",width:`${pct}%`,borderRadius:4}}/></div></div>);})}
        {view==="session"&&(
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",padding:"10px 16px",background:C.card3,borderBottom:`1px solid ${C.border}`}}>{["Activity","Kid","Session","Cost"].map(h=><div key={h} style={{fontSize:11,fontWeight:600,color:C.text3,textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</div>)}</div>
            {allS.filter(s=>s.enrolled).sort((a,b)=>Number(b.cost||0)-Number(a.cost||0)).map((s,i)=>{const kid=kids.find(k=>k.key===s.kidKey);return(<div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",padding:"10px 16px",borderBottom:`1px solid ${C.border}`,background:i%2===0?C.card:C.card2}}><div><SportPill name={s.sportName}/></div><div style={{alignSelf:"center"}}>{kid&&<KidPill kid={kid} small/>}</div><div style={{fontSize:12,color:C.text2,alignSelf:"center"}}>{s.name}</div><div style={{fontWeight:600,color:C.text,fontSize:13,alignSelf:"center"}}>{fmtMoney(s.cost)}</div></div>);})}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",padding:"12px 16px",background:C.card3,borderTop:`1px solid ${C.border}`}}><div style={{fontWeight:600,color:C.text,gridColumn:"1/4"}}>Total</div><div style={{fontWeight:700,color:C.accent,fontSize:15}}>{fmtMoney(grandTotal)}</div></div>
          </div>
        )}
      </div>
    );
  }

  // ── Sport detail page ──
  const selectedSport=sports.find(s=>s.id===selectedSportId);
  if(sub==="activities"&&selectedSportId&&selectedSport){
    const sp=selectedSport;
    const sc=getSC(sp.name);
    const icon2=SPORT_ICON[sp.name]||"🎯";
    const kid=kids.find(k=>k.key===sp.kidKey);
    const today2=new Date();

    // derive active session (enrolled + not past), else most recent enrolled
    const activeSess=sp.sessions.find(s=>{
      if(!s.enrolled)return false;
      const end=s.end?new Date(s.end+"T12:00:00"):null;
      return !end||end>=today2;
    })||sp.sessions.filter(s=>s.enrolled).slice(-1)[0]||sp.sessions[0]||null;

    // upcoming meets across all sessions
    const allMeets=sp.sessions.flatMap(sess=>sess.meets.map(m=>({...m,sessId:sess.id,sessName:sess.name})));
    const upcomingMeets=allMeets.filter(m=>{const d=new Date((m.dateStart||m.date)+"T12:00:00");return d>=today2;}).sort((a,b)=>new Date((a.dateStart||a.date)+"T12:00:00")-new Date((b.dateStart||b.date)+"T12:00:00"));
    const pastMeets=allMeets.filter(m=>{const d=new Date((m.dateStart||m.date)+"T12:00:00");return d<today2;}).sort((a,b)=>new Date((b.dateStart||b.date)+"T12:00:00")-new Date((a.dateStart||a.date)+"T12:00:00"));
    const allResults=allMeets.filter(m=>m.results&&m.results.length>0);

    // next practice day calc
    function nextPracticeDate(sess){
      if(!sess||!sess.practiceDays||sess.practiceDays.length===0)return null;
      const dayMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
      const indices=sess.practiceDays.map(d=>dayMap[d]).filter(d=>d!==undefined);
      if(!indices.length)return null;
      const sessEnd=sess.end?new Date(sess.end+"T12:00:00"):null;
      for(let i=0;i<21;i++){
        const d=new Date(today2);d.setDate(today2.getDate()+i);
        if(sessEnd&&d>sessEnd)break;
        if(indices.includes(d.getDay()))return d;
      }
      return null;
    }
    // returns next N upcoming practice dates with per-day details
    function nextPracticeDates(sess,n=5){
      if(!sess||!sess.practiceDays||sess.practiceDays.length===0)return[];
      const dayMap={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
      const indices=sess.practiceDays.map(d=>dayMap[d]).filter(d=>d!==undefined);
      const sessEnd=sess.end?new Date(sess.end+"T12:00:00"):null;
      const results=[];
      for(let i=0;i<60&&results.length<n;i++){
        const d=new Date(today2);d.setDate(today2.getDate()+i);
        if(sessEnd&&d>sessEnd)break;
        if(indices.includes(d.getDay())){
          const dayName=DAYS[d.getDay()];
          const det=(sess.practiceDayDetails||[]).find(x=>x.day===dayName);
          results.push({date:d,dayName,time:det?det.time:sess.practiceTime,timeEnd:det?det.timeEnd:"",location:det?det.location:sess.practiceLocation});
        }
      }
      return results;
    }
    const nextPrac=activeSess?nextPracticeDate(activeSess):null;
    const diffDays=nextPrac?Math.round((nextPrac-today2)/(1000*60*60*24)):null;
    const nextPracLabel=diffDays===0?"Today":diffDays===1?"Tomorrow":`In ${diffDays} days`;

    // stat bar shortcut → tab  (state lives at ActivitiesPage level)

    // shared meet row — plain function (not a React component) to avoid nested-component crashes
    function renderMeetRow(m,sessId,sessName,isPast){
      const conf=conflicts.find(c=>c.kidKey===sp.kidKey&&c.date===(m.dateStart||m.date));

            <div style={{fontSize:11,color:C.text3,marginBottom:4}}>

          </div>
          <div style={{display:"flex",gap:4,flexShrink:0}}>
            <Btn onClick={()=>setEditMeet({sportId:sp.id,sessionId:sessId,meet:m})} variant="secondary" small>Edit</Btn>
            <Btn onClick={()=>deleteMeet(sp.id,sessId,m.id)} variant="danger" small>✕</Btn>
          </div>
        </div>
      );
    }

    // active session label for stat bar
    const activeSessionLabel=activeSess?(activeSess.enrolled&&new Date(activeSess.end+"T12:00:00")>=today2?"Active":activeSess.name):sp.sessions.length?"—":"No sessions";
    const activeSessionName=activeSess?activeSess.name:activeSessionLabel;

    const TABS=[{k:"overview",l:"Overview"},{k:"practices",l:"Practices"},{k:"meets",l:"Meets & games"},{k:"results",l:"Results"},{k:"sessions",l:"All sessions"}];

    return(
      <div>
        {/* top bar */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <button onClick={()=>setSelectedSportId(null)} style={{background:"none",border:"none",cursor:"pointer",color:C.accent,fontSize:13,padding:0}}>‹ Back to activities</button>
          <div style={{display:"flex",gap:8}}>
            {sp.website&&<a href={sp.website} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:sc.txt,background:sc.bg,padding:"5px 12px",borderRadius:7,textDecoration:"none",border:`1px solid ${sc.border}`}}>Site ↗</a>}
            <Btn onClick={()=>setEditSport(sp)} variant="secondary" small>Edit</Btn>
            <Btn onClick={()=>setAddSession({sportId:sp.id})} small>+ Add session</Btn>
          </div>
        </div>

        {/* header card with stat bar */}
        <div style={{background:C.card,border:`1.5px solid ${sc.border}`,borderRadius:16,marginBottom:16,overflow:"hidden"}}>
          {/* identity row */}
          <div style={{display:"flex",alignItems:"flex-start",gap:16,padding:"18px 20px",background:sc.bg}}>
              <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:5,flexWrap:"wrap"}}>
                <div style={{fontSize:22,fontWeight:700,color:sc.txt}}>{sp.name}</div>
                {kid&&<KidPill kid={kid}/>}
                {activeSess&&new Date(activeSess.end+"T12:00:00")>=today2&&activeSess.enrolled&&<span style={{fontSize:11,background:"#052E16",color:"#4ADE80",padding:"2px 8px",borderRadius:20,fontWeight:600}}>Active</span>}
              </div>
              {sp.teamName&&<div style={{fontSize:13,color:"#94A3B8",marginBottom:2}}>{sp.teamName}</div>}
              {sp.location&&<div style={{fontSize:12,color:"#64748B"}}>{sp.location}{sp.phone?` · ${sp.phone}`:""}</div>}
              {sp.coach&&<div style={{fontSize:12,color:"#64748B",marginTop:1}}>Coach: {sp.coach}</div>}
              {sp.notes&&<div style={{fontSize:11,color:"#4A5568",marginTop:5,fontStyle:"italic"}}>{sp.notes}</div>}
            </div>
          </div>
          {/* stat bar */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",borderTop:`1px solid ${sc.border}`}}>
            {[
              {label:"Current session",val:activeSessionName,tab:"overview"},
              {label:"Practice days",val:activeSess&&activeSess.practiceDays.length?activeSess.practiceDays.join(" & "):"—",tab:"practices"},
              {label:"Upcoming meets",val:upcomingMeets.length,valColor:upcomingMeets.length>0?"#4ADE80":C.text2,tab:"meets"},
              {label:"Session ends",val:activeSess&&activeSess.end?new Date(activeSess.end+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}):"—",tab:"sessions"},
            ].map((s,i)=>(
              <div key={i} onClick={()=>setDetailTab(s.tab)} style={{padding:"11px 14px",borderRight:i<3?`1px solid ${sc.border}`:"none",cursor:"pointer",background:detailTab===s.tab?sc.bg:"transparent",transition:"background 0.12s"}}>
                <div style={{fontSize:14,fontWeight:600,color:s.valColor||sc.txt,marginBottom:3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.val}</div>
                <div style={{fontSize:10,color:C.text3,textTransform:"uppercase",letterSpacing:"0.05em"}}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* tabs */}
        <div style={{display:"flex",borderBottom:`1px solid ${C.border}`,marginBottom:18,overflowX:"auto"}}>
          {TABS.map(t=>(
            <button key={t.k} onClick={()=>setDetailTab(t.k)} style={{padding:"9px 16px",background:"none",border:"none",borderBottom:`2px solid ${detailTab===t.k?sc.txt:"transparent"}`,color:detailTab===t.k?sc.txt:C.text2,cursor:"pointer",fontSize:13,fontWeight:detailTab===t.k?600:400,whiteSpace:"nowrap",marginBottom:-1}}>
              {t.l}
            </button>
          ))}
        </div>

        {/* ── Overview tab ── */}
        {detailTab==="overview"&&(
          <div>
            {/* next up */}
            <div style={{fontSize:11,fontWeight:600,color:C.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Next up</div>
            {(()=>{
              // build merged upcoming list: next 5 practices + upcoming meets, sorted by date
              const upPracs=activeSess?nextPracticeDates(activeSess,5).map(p=>({
                _type:"practice",_date:p.date,dayName:p.dayName,time:p.time,timeEnd:p.timeEnd,location:p.location||activeSess.practiceLocation||sp.location||""
              })):[];
              const upMeets=upcomingMeets.slice(0,5).map(m=>({_type:"meet",_date:new Date((m.dateStart||m.date)+"T12:00:00"),...m}));
              const merged=[...upPracs,...upMeets].sort((a,b)=>a._date-b._date).slice(0,6);
              if(merged.length===0)return <div style={{textAlign:"center",padding:"20px",color:C.text3,fontSize:13,background:C.card,borderRadius:12,border:`1px solid ${C.border}`,marginBottom:12}}>Nothing coming up — add a meet or check practice days.</div>;
              return merged.map((item,idx)=>{
                const diff=Math.round((item._date-today2)/(1000*60*60*24));
                const lbl=diff===0?"Today":diff===1?"Tomorrow":`In ${diff} days`;
                if(item._type==="practice") return(
                  <div key={idx} style={{background:sc.bg,border:`1px solid ${sc.border}`,borderRadius:12,padding:"14px 16px",marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                      <span style={{fontSize:11,background:"rgba(0,0,0,0.3)",color:sc.txt,padding:"2px 9px",borderRadius:20}}>Practice</span>
                      <span style={{fontSize:11,background:"#052E16",color:"#4ADE80",padding:"2px 9px",borderRadius:20}}>{lbl}</span>
                    </div>
                    <div style={{fontSize:14,fontWeight:600,color:C.text,marginBottom:2}}>{item._date.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
                    <div style={{fontSize:12,color:C.text2}}>{item.time}{item.timeEnd?` – ${item.timeEnd}`:""}{item.location?` · ${item.location}`:""}</div>
                  </div>
                );
                return(
                  <div key={idx} style={{background:"#1A120A",border:`1px solid #78350F`,borderRadius:12,padding:"14px 16px",marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                      <span style={{fontSize:11,background:"rgba(0,0,0,0.3)",color:"#FB923C",padding:"2px 9px",borderRadius:20}}>Meet</span>
                      <span style={{fontSize:11,background:"#052E16",color:"#4ADE80",padding:"2px 9px",borderRadius:20}}>{lbl}</span>
                    </div>
                    <div style={{fontSize:14,fontWeight:600,color:C.text,marginBottom:2}}>{item.name}</div>
                    <div style={{fontSize:12,color:C.text2}}>{fmtDate(item.dateStart||item.date)}{item.time?` · ${item.time}`:""}{item.location?` · ${item.location}`:""}</div>
                  </div>
                );
              });
            })()}

            {/* practice schedule summary */}
            {activeSess&&activeSess.practiceDays.length>0&&(
              <>
                <div style={{fontSize:11,fontWeight:600,color:C.text3,textTransform:"uppercase",letterSpacing:"0.06em",margin:"18px 0 10px"}}>Practice schedule · {activeSess.name}</div>
                <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px",marginBottom:4}}>
                  {activeSess.practiceDays.map(d=>{
                    const det=(activeSess.practiceDayDetails||[]).find(x=>x.day===d);
                    const t=det?det.time:activeSess.practiceTime;
                    const te=det?det.timeEnd:"";
                    const loc=det?det.location:activeSess.practiceLocation||sp.location||"";
                    return(
                      <div key={d} style={{display:"flex",alignItems:"center",gap:10,background:sc.bg,border:`1px solid ${sc.border}`,borderRadius:8,padding:"7px 12px",marginBottom:5}}>
                        <span style={{fontWeight:600,fontSize:12,color:sc.txt,width:32,flexShrink:0}}>{d}</span>
                        <span style={{fontSize:12,color:C.text}}>{t}{te?` – ${te}`:""}</span>
                        {loc&&<span style={{fontSize:11,color:C.text3,marginLeft:4}}>· {loc}</span>}
                      </div>
                    );
                  })}
                  {activeSess.practiceNotes&&<div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px",marginTop:4,fontSize:12,color:C.text2,fontStyle:"italic"}}>📝 {activeSess.practiceNotes}</div>}
                  <div style={{fontSize:11,color:C.text3,marginTop:6}}>{fmtDate(activeSess.start)} – {fmtDate(activeSess.end)}</div>
                </div>
              </>
            )}

            {/* all meets this session */}
            {activeSess&&(
              <>
                <div style={{fontSize:11,fontWeight:600,color:C.text3,textTransform:"uppercase",letterSpacing:"0.06em",margin:"18px 0 10px"}}>All meets · {activeSess.name}</div>
                <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"4px 16px",marginBottom:4}}>
                  {activeSess.meets.length===0&&<div style={{padding:"14px 0",textAlign:"center",color:C.text3,fontSize:13}}>No meets added yet.</div>}
                  {[...activeSess.meets].sort((a,b)=>new Date((b.dateStart||b.date)+"T12:00:00")-new Date((a.dateStart||a.date)+"T12:00:00")).map(m=>{
                    const isPast=new Date((m.dateStart||m.date)+"T12:00:00")<today2;
                    return renderMeetRow(m,activeSess.id,null,isPast);
                  })}
                  <div style={{borderTop:`1px dashed ${C.border}`,padding:"10px 0"}}>
                    <button onClick={()=>setAddMeet({sportId:sp.id,sessionId:activeSess.id,kidKey:sp.kidKey})} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:C.text3,padding:0}}>+ Add meet to {activeSess.name}</button>
                  </div>
                </div>
              </>
            )}
          </div>
        )}

        {/* ── Practices tab ── */}
        {detailTab==="practices"&&(
          <div>
            {sp.sessions.length===0&&<div style={{textAlign:"center",padding:"30px",color:C.text3,fontSize:13,background:C.card,borderRadius:12,border:`1px solid ${C.border}`}}>No sessions yet. Add a session to track practices.</div>}
            {sp.sessions.map(sess=>{
              const endDate=sess.end?new Date(sess.end+"T12:00:00"):null;
              const isPastSess=endDate&&endDate<today2;
              const isActiveSess=sess.enrolled&&!isPastSess;
              const np=isActiveSess?nextPracticeDate(sess):null;
              const nd=np?Math.round((np-today2)/(1000*60*60*24)):null;
              return(
                <div key={sess.id} style={{background:C.card,border:`1px solid ${isActiveSess?sc.border:C.border}`,borderRadius:12,padding:"16px 18px",marginBottom:12,opacity:isPastSess?0.6:1}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:14,fontWeight:600,color:isActiveSess?sc.txt:C.text}}>{sess.name}</span>
                      <span style={{fontSize:10,background:isActiveSess?"#052E16":isPastSess?"#1F2937":"#2D2005",color:isActiveSess?"#4ADE80":isPastSess?"#6B7280":"#FCD34D",padding:"2px 8px",borderRadius:20}}>{isActiveSess?"Active":isPastSess?"Past":"Reference"}</span>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <Btn onClick={()=>setEditSession({sportId:sp.id,session:sess})} variant="secondary" small>Edit</Btn>
                      <Btn onClick={()=>deleteSession(sp.id,sess.id)} variant="danger" small>✕</Btn>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:C.text2,marginBottom:10}}>{fmtDate(sess.start)} – {fmtDate(sess.end)}{sess.cost?` · ${fmtMoney(sess.cost)}`:""}</div>
                  {sess.practiceDays.length>0?(
                    <>
                      {/* per-day detail rows */}
                      {sess.practiceDays.map(d=>{
                        const det=(sess.practiceDayDetails||[]).find(x=>x.day===d);
                        const t=det?det.time:sess.practiceTime;
                        const te=det?det.timeEnd:"";
                        const loc=det?det.location:sess.practiceLocation;
                        return(
                          <div key={d} style={{display:"flex",alignItems:"center",gap:10,background:isActiveSess?sc.bg:C.card2,border:`1px solid ${isActiveSess?sc.border:C.border}`,borderRadius:8,padding:"7px 12px",marginBottom:5}}>
                            <span style={{fontWeight:600,fontSize:12,color:isActiveSess?sc.txt:C.text2,width:32,flexShrink:0}}>{d}</span>
                            <span style={{fontSize:12,color:C.text}}>{t}{te?` – ${te}`:""}</span>
                            {loc&&<span style={{fontSize:11,color:C.text3,marginLeft:4}}>· {loc}</span>}
                          </div>
                        );
                      })}
                      {sess.practiceNotes&&<div style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px",marginTop:4,fontSize:12,color:C.text2,fontStyle:"italic"}}>📝 {sess.practiceNotes}</div>}
                      {np&&<div style={{marginTop:8}}><span style={{fontSize:11,background:"#052E16",color:"#4ADE80",padding:"2px 10px",borderRadius:20}}>Next: {np.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}{nd===0?" — Today":nd===1?" — Tomorrow":""}</span></div>}
                    </>
                  ):(
                    <div style={{fontSize:12,color:C.text3,fontStyle:"italic"}}>No practice days set.</div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* ── Meets & games tab ── */}
        {detailTab==="meets"&&(
          <div>
            {upcomingMeets.length>0&&(
              <>
                <div style={{fontSize:11,fontWeight:600,color:C.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Upcoming</div>
                <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"4px 16px",marginBottom:16}}>
                  {upcomingMeets.map(m=>renderMeetRow(m,m.sessId,m.sessName,false))}
                </div>
              </>
            )}
            {pastMeets.length>0&&(
              <>
                <div style={{fontSize:11,fontWeight:600,color:C.text3,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Past</div>
                <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"4px 16px",marginBottom:16}}>
                  {pastMeets.map(m=>renderMeetRow(m,m.sessId,m.sessName,true))}
                </div>
              </>
            )}
            {allMeets.length===0&&<div style={{textAlign:"center",padding:"30px",color:C.text3,fontSize:13,background:C.card,borderRadius:12,border:`1px solid ${C.border}`,marginBottom:16}}>No meets added yet.</div>}
            {activeSess&&(
              <button onClick={()=>setAddMeet({sportId:sp.id,sessionId:activeSess.id,kidKey:sp.kidKey})} style={{width:"100%",padding:"9px",borderRadius:8,border:`1px dashed ${C.border}`,background:"transparent",cursor:"pointer",fontSize:12,color:C.text3}}>+ Add meet to {activeSess.name}</button>
            )}
          </div>
        )}

        {/* ── Results tab ── */}
        {detailTab==="results"&&(
          <div>
            {allResults.length===0&&<div style={{textAlign:"center",padding:"30px",color:C.text3,fontSize:13,background:C.card,borderRadius:12,border:`1px solid ${C.border}`}}>No results recorded yet. Add results when editing a meet.</div>}
            {allResults.map((m,i)=>{
              const isMulti=m.dateEnd&&m.dateEnd!==m.dateStart;
              return(
                <div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"14px 16px",marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:14,color:C.text,marginBottom:2}}>★ {m.name}</div>
                      <div style={{fontSize:12,color:C.text2}}>{isMulti?`${fmtDate(m.dateStart)} – ${fmtDate(m.dateEnd)}`:fmtDate(m.dateStart||m.date)}{m.location?` · ${m.location}`:""}</div>
                      {m.sessName&&<div style={{fontSize:11,color:C.text3,marginTop:2}}>{m.sessName}</div>}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {m.results.map((r,ri)=>(
                      <div key={ri} style={{background:"#0C2340",border:"1px solid #1E40AF",borderRadius:8,padding:"8px 12px",fontSize:12}}>
                        <div style={{fontWeight:600,color:"#38BDF8",marginBottom:2}}>{r.event}</div>
                        <div style={{color:C.text}}>{r.time} · <strong>{r.place}</strong></div>
                        {r.notes&&<div style={{fontSize:11,color:"#64748B",marginTop:2}}>{r.notes}</div>}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── All sessions tab ── */}
        {detailTab==="sessions"&&(
          <div>
            {sp.sessions.length===0&&<div style={{textAlign:"center",padding:"30px",color:C.text3,fontSize:13,background:C.card,borderRadius:12,border:`1px solid ${C.border}`,marginBottom:12}}>No sessions yet.</div>}
            {sp.sessions.map(sess=>{
              const endDate=sess.end?new Date(sess.end+"T12:00:00"):null;
              const isPastSess=endDate&&endDate<today2;
              const isActiveSess=sess.enrolled&&!isPastSess;
              const statusLabel=isActiveSess?"Active":isPastSess?"Past":sess.enrolled?"Upcoming":"Reference";
              const statusColor=isActiveSess?"#4ADE80":isPastSess?"#6B7280":"#FCD34D";
              const statusBg=isActiveSess?"#052E16":isPastSess?"#1F2937":"#2D2005";
              return(
                <div key={sess.id} style={{background:C.card,border:`1px solid ${isActiveSess?sc.border:C.border}`,borderLeft:`4px solid ${isActiveSess?sc.txt:C.border}`,borderRadius:12,padding:"14px 18px",marginBottom:10,display:"flex",alignItems:"center",gap:14,opacity:isPastSess?0.65:1}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                      <span style={{fontSize:14,fontWeight:600,color:isActiveSess?sc.txt:C.text}}>{sess.name}</span>
                      <span style={{fontSize:10,background:statusBg,color:statusColor,padding:"2px 8px",borderRadius:20}}>{statusLabel}</span>
                    </div>
                    <div style={{fontSize:12,color:C.text2,marginBottom:3}}>{fmtDate(sess.start)} – {fmtDate(sess.end)}</div>
                    {sess.practiceDays.length>0&&<div style={{fontSize:12,color:C.text3}}>{sess.practiceDays.join(", ")} at {sess.practiceTime}</div>}
                    {sess.cost&&<div style={{fontSize:12,color:C.text2,marginTop:3}}>{fmtMoney(sess.cost)}</div>}
                    <div style={{fontSize:11,color:C.text3,marginTop:3}}>{sess.meets.length} meet{sess.meets.length!==1?"s":""}</div>
                  </div>
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    <Btn onClick={()=>setEditSession({sportId:sp.id,session:sess})} variant="secondary" small>Edit</Btn>
                    <Btn onClick={()=>deleteSession(sp.id,sess.id)} variant="danger" small>✕</Btn>
                  </div>
                </div>
              );
            })}
            <button onClick={()=>setAddSession({sportId:sp.id})} style={{width:"100%",padding:"10px",borderRadius:10,border:`1px dashed ${C.border}`,background:"transparent",cursor:"pointer",fontSize:12,color:C.text3,marginTop:4}}>+ Add session</button>
          </div>
        )}

        {(editSport||addSport)&&<SportModal sport={editSport} sportOptions={sportOptions} onSave={saveSport} onClose={()=>{setAddSport(false);setEditSport(null);}}/>}
        {addSession&&<SessionModal onSave={sess=>saveSession(addSession.sportId,sess)} onClose={()=>setAddSession(null)}/>}
        {editSession&&<SessionModal session={editSession.session} onSave={sess=>saveSession(editSession.sportId,sess)} onClose={()=>setEditSession(null)}/>}
        {addMeet&&<MeetModal kidKey={addMeet.kidKey} onSave={meet=>saveMeet(addMeet.sportId,addMeet.sessionId,meet)} onClose={()=>setAddMeet(null)} kids={kids}/>}
        {editMeet&&<MeetModal meet={editMeet.meet} kidKey={sports.find(s=>s.id===editMeet.sportId)?.kidKey} onSave={meet=>saveMeet(editMeet.sportId,editMeet.sessionId,meet)} onClose={()=>setEditMeet(null)} kids={kids}/>}
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",gap:5,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
        {SUBTABS.map(t=><button key={t.k} onClick={()=>{setSub(t.k);setSelectedSportId(null);}} style={{padding:"7px 16px",borderRadius:8,border:`1px solid ${sub===t.k?C.accent:C.border}`,background:sub===t.k?C.accent:C.card2,color:sub===t.k?"#fff":C.text2,cursor:"pointer",fontSize:13,fontWeight:sub===t.k?500:400}}>{t.l}</button>)}
        <div style={{flex:1}}/>
        <Btn onClick={()=>setAddSport(true)} small>+ Add activity</Btn>
      </div>
      {conflicts.length>0&&(
        <div style={{background:"#2D1A05",border:"1px solid #78350F",borderRadius:10,padding:"12px 14px",marginBottom:14}}>
          <div style={{fontWeight:600,fontSize:13,color:C.warning,marginBottom:8}}>⚠ {conflicts.length} conflict{conflicts.length>1?"s":""}</div>
          {conflicts.map((c,i)=>{const kid=kids.find(k=>k.key===c.kidKey);return(
            <div key={i} style={{background:C.card2,borderRadius:8,padding:"9px 12px",marginBottom:6}}>
              <div style={{fontWeight:500,marginBottom:5,color:C.text,fontSize:12}}>{kid?.name} — {c.date}: <span style={{color:C.warning}}>{c.events.map(e=>e.name).join(" vs ")}</span></div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {c.events.map((e,ei)=><button key={ei} onClick={()=>resolveConflict(c,e.meetId)} style={{padding:"3px 11px",borderRadius:6,border:`1px solid ${c.chosen===e.meetId?C.accent:C.border}`,background:c.chosen===e.meetId?C.accent:C.card,color:c.chosen===e.meetId?"#fff":C.text,cursor:"pointer",fontSize:12}}>{c.chosen===e.meetId?"✓ ":""}{e.name}</button>)}
                <button onClick={()=>resolveConflict(c,null)} style={{padding:"3px 11px",borderRadius:6,border:`1px solid ${C.border}`,background:C.card2,color:C.text3,cursor:"pointer",fontSize:12}}>Clear</button>
              </div>
            </div>
          );})}
        </div>
      )}
      {sub==="calendar"&&(
        <div>
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:12,color:C.text2,fontWeight:500}}>Show:</span>
            <button onClick={()=>setShowEC(!showEC)} style={{padding:"3px 12px",borderRadius:6,border:`1px solid ${showEC?C.accent:C.border}`,background:showEC?"#0C2340":C.card2,color:showEC?"#38BDF8":C.text3,cursor:"pointer",fontSize:12}}>Extracurriculars</button>
            <button onClick={()=>setShowSummer(!showSummer)} style={{padding:"3px 12px",borderRadius:6,border:`1px solid ${showSummer?C.accent:C.border}`,background:showSummer?"#2D1A05":C.card2,color:showSummer?"#FCD34D":C.text3,cursor:"pointer",fontSize:12}}>Summer</button>
            <span style={{fontSize:11,color:C.text3}}>Tap any event to edit</span>
          </div>
          <CalendarView sports={sports} summerData={summerData} showSummer={showSummer} showEC={showEC} conflicts={conflicts} onEventClick={handleCalClick} kids={kids}/>
        </div>
      )}
      {sub==="activities"&&!selectedSportId&&(
        <div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8,alignItems:"center"}}>
            <span style={{fontSize:12,color:C.text2,alignSelf:"center"}}>Kid:</span>
            {[{key:"all",name:"All"},...kids].map(k=><button key={k.key} onClick={()=>setFilterKid(k.key)} style={{padding:"4px 12px",borderRadius:20,border:`1px solid ${filterKid===k.key?C.accent:C.border}`,background:filterKid===k.key?C.accent:C.card2,color:filterKid===k.key?"#fff":C.text2,fontSize:12,cursor:"pointer"}}>{k.name}</button>)}
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:18,alignItems:"center"}}>
            <span style={{fontSize:12,color:C.text2,alignSelf:"center"}}>Sport:</span>
            {["all",...uniqueSports].map(s=><button key={s} onClick={()=>setFilterSport(s)} style={{padding:"4px 12px",borderRadius:20,border:`1px solid ${filterSport===s?C.accent:C.border}`,background:filterSport===s?C.accent:C.card2,color:filterSport===s?"#fff":C.text2,fontSize:12,cursor:"pointer"}}>{s==="all"?"All sports":s}</button>)}
          </div>
          {(()=>{
            // when All kids selected, group same-sport entries into one row
            let rows=[];
            if(filterKid==="all"){
              const grouped={};
              filtered.forEach(sp=>{
                if(!grouped[sp.name])grouped[sp.name]=[];
                grouped[sp.name].push(sp);
              });
              rows=Object.values(grouped);
            } else {
              rows=filtered.map(sp=>[sp]);
            }
            if(rows.length===0)return <div style={{textAlign:"center",padding:"40px 20px",color:C.text3,fontSize:13}}>No activities match this filter.</div>;
            return(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {rows.map(group=>{
                  const sp0=group[0];
                  const sc=getSC(sp0.name);
                  const isActive=group.some(sp=>sp.sessions.some(s=>s.enrolled));
                  const totalMeets=group.reduce((n,sp)=>n+sp.sessions.reduce((m,s)=>m+s.meets.length,0),0);
                  const activeSessName=group.flatMap(sp=>sp.sessions).find(s=>s.enrolled)?.name||"";
                  return(
                    <div key={sp0.name+sp0.id} style={{border:`1px solid ${C.border}`,borderLeft:`3px solid ${sc.txt}`,borderRadius:12,overflow:"hidden",background:C.card}}
                      onMouseEnter={e=>e.currentTarget.style.borderColor=sc.txt}
                      onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                      {/* sport header row */}
                      <div style={{display:"grid",gridTemplateColumns:"1fr auto",alignItems:"center",gap:12,padding:"14px 16px"}}>
                        <div>
                          <div style={{fontSize:15,fontWeight:600,color:sc.txt,marginBottom:2}}>{sp0.name}</div>
                          <div style={{fontSize:12,color:C.text2}}>{sp0.teamName||sp0.location||"—"}</div>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          {activeSessName&&<span style={{fontSize:11,color:C.text3}}>{activeSessName}</span>}
                          {isActive&&<span style={{fontSize:10,background:"#052E16",color:"#4ADE80",padding:"2px 8px",borderRadius:20,fontWeight:500}}>Active</span>}
                          {totalMeets>0&&<span style={{fontSize:11,color:C.text3}}>{totalMeets} meet{totalMeets!==1?"s":""}</span>}
                        </div>
                      </div>
                      {/* kid strip */}
                      <div style={{display:"flex",borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
                        {group.map((sp,gi)=>{
                          const kid=kids.find(k=>k.key===sp.kidKey);
                          const activeSess=sp.sessions.find(s=>s.enrolled);
                          const pracDays=activeSess?.practiceDays||[];
                          const details=activeSess?.practiceDayDetails||[];
                          // build compact schedule: if all days same time, show "Tue · Thu · 4:00 PM", else just days
                          const times=[...new Set(details.map(d=>d.time).filter(Boolean))];
                          const scheduleLabel=pracDays.length>0
                            ?(times.length===1?`${pracDays.join(" · ")} · ${times[0]}`:pracDays.join(" · "))
                            :"No schedule set";
                          return(
                            <div key={sp.id} onClick={()=>{setSelectedSportId(sp.id);setDetailTab("overview");}}
                              style={{flex:"1 1 200px",padding:"10px 16px",borderRight:gi<group.length-1?`1px solid ${C.border}`:"none",display:"flex",alignItems:"center",gap:10,cursor:"pointer",minWidth:0}}
                              onMouseEnter={e=>e.currentTarget.style.background=sc.bg}
                              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                              {kid&&<KidPill kid={kid} small/>}
                              <span style={{fontSize:11,color:C.text2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{scheduleLabel}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
                <div onClick={()=>setAddSport(true)}
                  style={{border:`1px dashed ${C.border}`,borderRadius:12,padding:"14px 18px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,color:C.text3,fontSize:13}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent}
                  onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <span style={{fontSize:20}}>＋</span> Add activity
                </div>
              </div>
            );
          })()}
        </div>
      )}
      {sub==="results"&&(
        <div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
            {[{key:"all",name:"All"},...kids].map(k=><button key={k.key} onClick={()=>setFilterKid(k.key)} style={{padding:"4px 12px",borderRadius:20,border:`1px solid ${filterKid===k.key?C.accent:C.border}`,background:filterKid===k.key?C.accent:C.card2,color:filterKid===k.key?"#fff":C.text2,fontSize:12,cursor:"pointer"}}>{k.name}</button>)}
          </div>
          {sports.filter(sp=>filterKid==="all"||sp.kidKey===filterKid).map(sp=>{
            const allMeets=sp.sessions.flatMap(sess=>sess.meets.filter(m=>m.results.length>0).map(m=>({...m,sessName:sess.name})));
            if(!allMeets.length)return null;
            const kid=kids.find(k=>k.key===sp.kidKey);
            return(
              <div key={sp.id} style={{marginBottom:18}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><SportPill name={sp.name}/>{kid&&<KidPill kid={kid}/>}<span style={{fontSize:13,color:C.text2}}>{sp.teamName}</span></div>
                {allMeets.map(m=>{const isMulti=m.dateEnd&&m.dateEnd!==m.dateStart;return(
                  <div key={m.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><div><div style={{fontWeight:600,fontSize:13,color:C.text}}>★ {m.name}</div><div style={{fontSize:12,color:C.text2}}>{isMulti?`${fmtDate(m.dateStart)} – ${fmtDate(m.dateEnd)}`:(m.dateStart||m.date)} · {m.location}</div></div><div style={{fontSize:11,color:C.text3}}>{m.sessName}</div></div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{m.results.map((r,ri)=><div key={ri} style={{background:"#0C2340",border:"1px solid #1E40AF",borderRadius:7,padding:"6px 12px",fontSize:12}}><div style={{fontWeight:600,color:"#38BDF8"}}>{r.event}</div><div style={{color:"#E2E8F0"}}>{r.time} · <b>{r.place}</b></div>{r.notes&&<div style={{fontSize:11,color:"#64748B"}}>{r.notes}</div>}</div>)}</div>
                  </div>
                );})}
              </div>
            );
          })}
          {!sports.some(sp=>(filterKid==="all"||sp.kidKey===filterKid)&&sp.sessions.some(s=>s.meets.some(m=>m.results.length>0)))&&<div style={{textAlign:"center",padding:"40px 20px",color:C.text3,fontSize:13}}>No results recorded yet.</div>}
        </div>
      )}
      {sub==="finances"&&<FinancesView/>}
      {(addSport||editSport)&&<SportModal sport={editSport} sportOptions={sportOptions} onSave={saveSport} onClose={()=>{setAddSport(false);setEditSport(null);}}/>}
      {addSession&&<SessionModal onSave={sess=>saveSession(addSession.sportId,sess)} onClose={()=>setAddSession(null)}/>}
      {editSession&&<SessionModal session={editSession.session} onSave={sess=>saveSession(editSession.sportId,sess)} onClose={()=>setEditSession(null)}/>}
      {addMeet&&<MeetModal kidKey={addMeet.kidKey} onSave={meet=>saveMeet(addMeet.sportId,addMeet.sessionId,meet)} onClose={()=>setAddMeet(null)} kids={kids}/>}
      {editMeet&&<MeetModal meet={editMeet.meet} kidKey={sports.find(s=>s.id===editMeet.sportId)?.kidKey} onSave={meet=>saveMeet(editMeet.sportId,editMeet.sessionId,meet)} onClose={()=>setEditMeet(null)} kids={kids}/>}
    </div>
  );
}

// ── Summer Section ──
function SummerEditModal({editing,schedule,weeks,providers,onSave,onClose}){
  const [a,setA]=useState(schedule[editing.kidKey][editing.weekIdx].a);
  const [note,setNote]=useState(schedule[editing.kidKey][editing.weekIdx].note);
  const [cost,setCost]=useState(schedule[editing.kidKey][editing.weekIdx].cost);
  const names=["JCC","Unscheduled",...providers.filter(p=>p.name!=="JCC").map(p=>p.name)];
  return(
    <Modal title={`${editing.kid.name} — ${weeks[editing.weekIdx].label}`} onClose={onClose}>
      <F label="Activity"><Sel value={a} onChange={setA} options={names}/></F>
      <F label="Notes"><Inp value={note} onChange={setNote}/></F>
      <F label="Cost"><Inp value={cost} onChange={setCost} placeholder="$650"/></F>
      <div style={{display:"flex",gap:10,marginTop:10}}>
        <Btn onClick={onClose} variant="secondary">Cancel</Btn>
        <Btn onClick={()=>onSave({a,note,cost})}>Save</Btn>
      </div>
    </Modal>
  );
}

function SummerAddYearModal({years,kids,onSave,onClose}){
  const [y,setY]=useState(Math.max(...years)+1);
  const [nw,setNw]=useState(8);
  function create(){
    const wks=Array.from({length:nw},(_,i)=>({n:i+1,label:`Week ${i+1}`,dates:`Week ${i+1}`}));
    const sched={};
    kids.forEach(k=>{sched[k.key]=Array(nw).fill(null).map(()=>({a:"Unscheduled",note:"",cost:""}));});
    onSave(y,{schedule:sched,providers:JSON.parse(JSON.stringify(DEF_PROVIDERS)),weeks:wks,notes:""});
  }
  return(
    <Modal title="Add new summer year" onClose={onClose}>
      <F label="Year"><Inp type="number" value={y} onChange={v=>setY(Number(v))}/></F>
      <F label="Weeks"><Inp type="number" value={nw} onChange={v=>setNw(Number(v))}/></F>
      <div style={{display:"flex",gap:10,marginTop:10}}>
        <Btn onClick={onClose} variant="secondary">Cancel</Btn>
        <Btn onClick={create}>Create {y}</Btn>
      </div>
    </Modal>
  );
}

function ProjectModal({project,onSave,onClose}){

  function addPayment(){setP({...p,payments:[...p.payments,{id:Date.now()+"",contractor:"",amount:"",date:"",account:"",note:""}]});}
  function updPayment(id,field,val){setP({...p,payments:p.payments.map(pay=>pay.id===id?{...pay,[field]:val}:pay)});}
  function delPayment(id){setP({...p,payments:p.payments.filter(pay=>pay.id!==id)});}

        <F label="Start date"><Inp type="date" value={p.startDate} onChange={v=>setP({...p,startDate:v})}/></F>
        <F label="End date"><Inp type="date" value={p.endDate} onChange={v=>setP({...p,endDate:v})}/></F>
      </div>
      <F label="Rooms worked on">
        <div style={{maxHeight:180,overflowY:"auto",border:`1px solid ${C.border}`,borderRadius:8,padding:8}}>
          {HOUSE_FLOORS.map(fl=>(
            <div key={fl.label} style={{marginBottom:8}}>
              <div style={{fontSize:10,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.06em",color:C.text3,marginBottom:4,paddingBottom:3,borderBottom:`1px solid ${C.border}`}}>{fl.label}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {fl.rooms.map(r=>{const full=`${fl.label} · ${r}`;const on=p.rooms.includes(full);return(
                  <button key={r} onClick={()=>togRoom(full)} style={{padding:"2px 9px",borderRadius:5,border:`1px solid ${on?C.accent:C.border}`,background:on?C.accent:C.card2,color:on?"#fff":C.text2,cursor:"pointer",fontSize:11}}>{r}</button>
                );})}
              </div>
            </div>
          ))}
        </div>
      </F>
      <F label={`Payments — running total: ${fmtMoney(total)}`}>
        {p.payments.map(pay=>(
          <div key={pay.id} style={{background:C.card2,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",marginBottom:6}}>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:8,marginBottom:6}}>

    const exists=projects.find(x=>x.id===p.id);

  }
